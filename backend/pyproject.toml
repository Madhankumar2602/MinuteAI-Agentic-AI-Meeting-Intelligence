[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minuteai-backend"
version = "0.1.0"
description = "MinuteAI - AI meeting intelligence backend (FastAPI)"
# Pinned to 3.12: 3.13/3.14 wheel support for the ML stack added in M4/M6
# (ctranslate2, sentence-transformers) is still incomplete.
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- Web layer ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",     # OAuth2 form body -> Swagger "Authorize" button

    # --- Validation & configuration ---
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",        # required backend for pydantic EmailStr

    # --- Persistence ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",               # async PostgreSQL driver
    "alembic>=1.13",               # schema migrations

    # --- Security ---
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",           # OWASP-recommended password hashing

    # --- AI provider (M2) ---
    "google-genai>=2.20",          # official Gemini SDK, see ADR 0006

    # --- AWS (M1: DynamoDB Local health check only) ---
    "boto3>=1.34",

    # --- Embeddings + vector search (M6, ADR 0012) ---
    "pgvector>=0.5",               # SQLAlchemy Vector type
    "onnxruntime>=1.20",           # runs all-MiniLM-L6-v2 on CPU, no PyTorch
    "tokenizers>=0.20",            # the model's own WordPiece tokenizer
    "huggingface-hub>=0.26",       # fetches model files at a pinned revision
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",                 # async test client
    "ruff>=0.6",                   # linter + formatter, replaces black/flake8/isort
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# "auto" means `async def test_...` just works, no @pytest.mark.asyncio needed.
asyncio_mode = "auto"
# pytest-asyncio >=1.0 requires this to be set explicitly.
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "live: calls a real external API; skipped unless RUN_LIVE_LLM_TESTS=1",
]

# ---------------------------------------------------------------------------
# ruff  (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
    "ASYNC",  # async-specific footguns
]
ignore = ["E501"]  # line length handled by the formatter
