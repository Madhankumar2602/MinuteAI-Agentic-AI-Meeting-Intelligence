# =============================================================================
# MinuteAI - local development infrastructure
#
# Variable substitution (${...}) is read automatically from the .env file
# sitting next to this file. That keeps credentials in ONE place, shared by
# both the containers and the FastAPI backend.
#
#   docker compose up -d       start
#   docker compose ps          status
#   docker compose logs -f     follow logs
#   docker compose down        stop   (data preserved)
#   docker compose down -v     stop   (DATA DESTROYED - deliberate reset only)
# =============================================================================

services:
  postgres:
    # Official pgvector image: PostgreSQL 16 with the vector extension already
    # compiled in. Using this instead of postgres:16 avoids having to build the
    # extension from source, and pins us to the same PG major version as the
    # RDS instance planned for M10.
    image: pgvector/pgvector:pg16
    container_name: minuteai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by the init script below to create the isolated test database.
      POSTGRES_DB_TEST: ${POSTGRES_DB_TEST}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts here run ONCE, only when the data volume is first created.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready returns 0 only when the server accepts connections. Without
      # this, `docker compose up -d` reports "started" while Postgres is still
      # booting, and the first migration fails with a connection error.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  dynamodb-local:
    # Amazon's official local DynamoDB emulator (Java). Same API surface as the
    # real service, so M3's job-state code needs no changes when we move to AWS.
    image: amazon/dynamodb-local:latest
    container_name: minuteai_dynamodb
    restart: unless-stopped
    # -sharedDb: one shared database file regardless of access key / region.
    #   Without it, DynamoDB Local silently partitions data per credential set,
    #   which makes "my table disappeared" bugs very hard to trace.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    ports:
      # Container listens on 8000; mapped to 8001 on the host because another
      # local project already occupies host port 8000.
      - "8001:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal

volumes:
  postgres_data:
    name: minuteai_postgres_data
  dynamodb_data:
    name: minuteai_dynamodb_data
