<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MinuteAI turns meetings into summaries, decisions, and action items." />
    <meta name="theme-color" content="#4f46e5" />
    <title>MinuteAI</title>
    <script>
      // Apply the saved theme before first paint, so dark-mode users never see
      // a white flash while the app loads. Mirrors src/lib/theme.ts.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("minuteai.theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
